<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>

  <!-- Page Header -->
  <div class="page-header">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:var(--sp-4);">
      <div>
        <h1 class="page-title" th:text="#{findOwners}">Find Owners</h1>
        <p class="page-subtitle">Search for existing owners by last name, or add a new owner to the system.</p>
      </div>
      <a th:href="@{/owners/new}" class="btn btn-primary" id="btn-add-owner-header">
        <i class="fa fa-plus" aria-hidden="true"></i>
        <span th:text="#{addOwner}">Add Owner</span>
      </a>
    </div>
  </div>

  <!-- Search Card -->
  <div class="card" style="max-width:560px;">
    <div class="card-header">
      <h2 class="card-title">
        <i class="fa fa-search" aria-hidden="true" style="color:var(--clr-primary-600);margin-right:var(--sp-2);"></i>
        Search by Last Name
      </h2>
    </div>
    <div class="card-body">
      <form th:object="${owner}" th:action="@{/owners}" method="get" id="search-owner-form" novalidate>

        <div class="form-group" th:with="valid=${!#fields.hasAnyErrors()}">
          <label class="form-label" for="lastName" th:text="#{lastName}">Last Name</label>
          <div style="display:flex;gap:var(--sp-3);flex-wrap:wrap;">
            <input
              class="form-control"
              id="lastName"
              th:field="*{lastName}"
              type="text"
              placeholder="Enter last name (or leave blank for all)"
              autocomplete="family-name"
              style="flex:1;min-width:200px;"
            />
            <button type="submit" class="btn btn-primary" id="btn-search-owner">
              <i class="fa fa-search" aria-hidden="true"></i>
              <span th:text="#{findOwner}">Find Owner</span>
            </button>
          </div>

          <!-- Validation errors -->
          <div th:if="${#fields.hasAnyErrors()}" style="margin-top:var(--sp-2);">
            <p th:each="err : ${#fields.allErrors()}"
               th:text="${err}"
               style="font-size:var(--text-xs);color:var(--clr-error);margin:0 0 var(--sp-1);display:flex;align-items:center;gap:var(--sp-1);">
              <i class="fa fa-exclamation-circle" aria-hidden="true"></i>
              Error
            </p>
          </div>
        </div>

      </form>
    </div>
    <div class="card-footer">
      <p style="font-size:var(--text-xs);color:var(--clr-text-secondary);margin:0;">
        <i class="fa fa-info-circle" aria-hidden="true" style="margin-right:var(--sp-1);"></i>
        Leave the field empty and click <strong>Find Owner</strong> to list all owners.
      </p>
    </div>
  </div>

</body>

</html>
