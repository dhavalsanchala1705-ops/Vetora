<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>

  <!-- Page Header -->
  <div class="page-header">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:var(--sp-4);">
      <div>
        <h1 class="page-title" th:text="#{owners}">Owners</h1>
        <p class="page-subtitle">
          Showing <strong th:text="${#lists.size(listOwners)}">0</strong> owner(s) found.
        </p>
      </div>
      <div style="display:flex;gap:var(--sp-3);">
        <a th:href="@{/owners/find}" class="btn btn-secondary" id="btn-search-owners">
          <i class="fa fa-search" aria-hidden="true"></i>
          Search Again
        </a>
        <a th:href="@{/owners/new}" class="btn btn-primary" id="btn-add-owner">
          <i class="fa fa-plus" aria-hidden="true"></i>
          <span th:text="#{addOwner}">Add Owner</span>
        </a>
      </div>
    </div>
  </div>

  <!-- Owners Table -->
  <div class="card">
    <div class="table-container">
      <table id="owners" class="table">
        <thead>
          <tr>
            <th th:text="#{name}">Name</th>
            <th th:text="#{address}">Address</th>
            <th th:text="#{city}">City</th>
            <th th:text="#{telephone}">Telephone</th>
            <th th:text="#{pets}">Pets</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="owner : ${listOwners}">
            <td>
              <a th:href="@{/owners/__${owner.id}__}"
                 th:text="${owner.firstName + ' ' + owner.lastName}"
                 style="font-weight:var(--fw-medium);color:var(--clr-primary-600);">
              </a>
            </td>
            <td th:text="${owner.address}" style="color:var(--clr-text-secondary);"></td>
            <td th:text="${owner.city}" style="color:var(--clr-text-secondary);"></td>
            <td>
              <span style="display:inline-flex;align-items:center;gap:var(--sp-1);color:var(--clr-text-secondary);">
                <i class="fa fa-phone" aria-hidden="true" style="font-size:var(--text-xs);"></i>
                <span th:text="${owner.telephone}"></span>
              </span>
            </td>
            <td>
              <div style="display:flex;flex-wrap:wrap;gap:var(--sp-1);">
                <th:block th:each="pet : ${owner.pets}">
                  <span class="badge badge-primary" th:text="${pet.name}"></span>
                </th:block>
                <span th:if="${owner.pets.isEmpty()}" style="color:var(--clr-text-muted);font-size:var(--text-xs);">No pets</span>
              </div>
            </td>
            <td>
              <a th:href="@{/owners/__${owner.id}__}" class="btn btn-ghost btn-sm" aria-label="View owner details">
                <i class="fa fa-eye" aria-hidden="true"></i>
                View
              </a>
            </td>
          </tr>
          <!-- Empty state -->
          <tr th:if="${#lists.isEmpty(listOwners)}">
            <td colspan="6">
              <div class="empty-state">
                <div class="empty-state-icon"><i class="fa fa-users" aria-hidden="true"></i></div>
                <p class="empty-state-title">No owners found</p>
                <p class="empty-state-text">Try a different search term or add a new owner.</p>
                <a th:href="@{/owners/new}" class="btn btn-primary" id="btn-empty-add-owner">
                  <i class="fa fa-plus" aria-hidden="true"></i>
                  Add Owner
                </a>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div th:if="${totalPages > 1}" class="card-footer"
         style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:var(--sp-3);">
      <p style="font-size:var(--text-sm);color:var(--clr-text-secondary);margin:0;">
        Page <strong th:text="${currentPage}">1</strong> of <strong th:text="${totalPages}">1</strong>
      </p>
      <div class="pagination-wrapper" style="padding:0;">

        <a th:if="${currentPage > 1}"
           th:href="@{'/owners?page=1'}"
           th:title="#{first}"
           class="page-link"
           aria-label="First page">
          <i class="fa fa-fast-backward" aria-hidden="true"></i>
        </a>
        <span th:unless="${currentPage > 1}" class="page-link disabled" aria-disabled="true">
          <i class="fa fa-fast-backward" aria-hidden="true"></i>
        </span>

        <a th:if="${currentPage > 1}"
           th:href="@{'/owners?page=__${currentPage - 1}__'}"
           th:title="#{previous}"
           class="page-link"
           aria-label="Previous page">
          <i class="fa fa-step-backward" aria-hidden="true"></i>
        </a>
        <span th:unless="${currentPage > 1}" class="page-link disabled" aria-disabled="true">
          <i class="fa fa-step-backward" aria-hidden="true"></i>
        </span>

        <span th:each="i : ${#numbers.sequence(1, totalPages)}">
          <a th:if="${currentPage != i}"
             th:href="@{'/owners?page=' + ${i}}"
             class="page-link"
             th:aria-label="'Page ' + ${i}">[[${i}]]</a>
          <span th:unless="${currentPage != i}" class="page-link active" th:aria-current="page">[[${i}]]</span>
        </span>

        <a th:if="${currentPage < totalPages}"
           th:href="@{'/owners?page=__${currentPage + 1}__'}"
           th:title="#{next}"
           class="page-link"
           aria-label="Next page">
          <i class="fa fa-step-forward" aria-hidden="true"></i>
        </a>
        <span th:unless="${currentPage < totalPages}" class="page-link disabled" aria-disabled="true">
          <i class="fa fa-step-forward" aria-hidden="true"></i>
        </span>

        <a th:if="${currentPage < totalPages}"
           th:href="@{'/owners?page=__${totalPages}__'}"
           th:title="#{last}"
           class="page-link"
           aria-label="Last page">
          <i class="fa fa-fast-forward" aria-hidden="true"></i>
        </a>
        <span th:unless="${currentPage < totalPages}" class="page-link disabled" aria-disabled="true">
          <i class="fa fa-fast-forward" aria-hidden="true"></i>
        </span>

      </div>
    </div>
  </div>

</body>

</html>
