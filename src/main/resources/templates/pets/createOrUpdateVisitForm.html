<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>

  <!-- Page Header -->
  <div class="page-header">
    <div>
      <div style="display:flex;align-items:center;gap:var(--sp-2);margin-bottom:var(--sp-3);">
        <a th:href="@{/owners/find}" style="font-size:var(--text-sm);color:var(--clr-text-secondary);">
          <i class="fa fa-users" aria-hidden="true" style="margin-right:var(--sp-1);"></i>Owners
        </a>
        <span style="color:var(--clr-text-muted);font-size:var(--text-sm);">/</span>
        <span style="font-size:var(--text-sm);color:var(--clr-primary-600);"
              th:text="${owner?.firstName + ' ' + owner?.lastName}">Owner</span>
        <span style="color:var(--clr-text-muted);font-size:var(--text-sm);">/</span>
        <span style="font-size:var(--text-sm);color:var(--clr-text-primary);"
              th:text="${pet.name}">Pet</span>
        <span style="color:var(--clr-text-muted);font-size:var(--text-sm);">/</span>
        <span style="font-size:var(--text-sm);color:var(--clr-text-primary);">New Visit</span>
      </div>
      <h1 class="page-title">
        <th:block th:if="${visit['new']}" th:text="#{new}">New </th:block>
        Visit
      </h1>
      <p class="page-subtitle">Record a clinical visit for this pet.</p>
    </div>
  </div>

  <!-- Pet Summary Card -->
  <div class="card" style="margin-bottom:var(--sp-6);">
    <div class="card-header">
      <h2 class="card-title">
        <i class="fa fa-paw" aria-hidden="true" style="color:var(--clr-primary-600);margin-right:var(--sp-2);"></i>
        <span th:text="#{pet}">Pet</span> Information
      </h2>
    </div>
    <div class="card-body">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:var(--sp-4);">
        <div class="owner-info-item">
          <span class="owner-info-label"><span th:text="#{name}">Name</span></span>
          <span class="owner-info-value" th:text="${pet.name}"></span>
        </div>
        <div class="owner-info-item">
          <span class="owner-info-label"><span th:text="#{birthDate}">Birth Date</span></span>
          <span class="owner-info-value" th:text="${#temporals.format(pet.birthDate, 'yyyy-MM-dd')}"></span>
        </div>
        <div class="owner-info-item">
          <span class="owner-info-label"><span th:text="#{type}">Type</span></span>
          <span class="owner-info-value">
            <span class="badge badge-primary" th:text="${pet.type}"></span>
          </span>
        </div>
        <div class="owner-info-item">
          <span class="owner-info-label"><span th:text="#{owner}">Owner</span></span>
          <span class="owner-info-value" th:text="${owner?.firstName + ' ' + owner?.lastName}"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- Visit Form Card -->
  <div class="card" style="max-width:600px;margin-bottom:var(--sp-6);">
    <div class="card-header">
      <h2 class="card-title">
        <i class="fa fa-calendar" aria-hidden="true" style="color:var(--clr-primary-600);margin-right:var(--sp-2);"></i>
        Visit Details
      </h2>
    </div>
    <div class="card-body">

      <form th:object="${visit}" class="form-horizontal" method="post" id="visit-form" novalidate>

        <!-- Date -->
        <div th:with="valid=${!#fields.hasErrors('date')}"
             th:class="${'form-group' + (valid ? '' : ' has-error')}">
          <label class="col-sm-2 control-label" for="date"><span th:text="#{date}">Date</span></label>
          <div class="col-sm-10">
            <input class="form-control" type="date" id="date" th:field="*{date}" th:min="${minVisitDate}" />
            <th:block th:if="${!valid}">
              <span class="help-inline" th:errors="*{date}"
                    style="color:var(--clr-error);font-size:var(--text-xs);">Error</span>
            </th:block>
          </div>
        </div>

        <!-- Description -->
        <div th:with="valid=${!#fields.hasErrors('description')}"
             th:class="${'form-group' + (valid ? '' : ' has-error')}">
          <label class="col-sm-2 control-label" for="description"><span th:text="#{description}">Description</span></label>
          <div class="col-sm-10">
            <input class="form-control" type="text" id="description" th:field="*{description}"
                   placeholder="e.g. Annual check-up, vaccination..." />
            <th:block th:if="${!valid}">
              <span class="help-inline" th:errors="*{description}"
                    style="color:var(--clr-error);font-size:var(--text-xs);">Error</span>
            </th:block>
          </div>
        </div>

        <!-- Hidden petId -->
        <div class="form-group">
          <div class="col-sm-offset-2 col-sm-10">
            <input type="hidden" name="petId" th:value="${pet.id}" />
            <div class="form-actions">
              <button class="btn btn-primary" type="submit" id="btn-submit-visit" th:text="#{addVisit}">
                Add Visit
              </button>
              <a th:href="@{/owners/{ownerId}(ownerId=${owner?.id})}" class="btn btn-secondary" id="btn-cancel-visit">
                Cancel
              </a>
            </div>
          </div>
        </div>

      </form>
    </div>
  </div>

  <!-- Previous Visits -->
  <div class="card" th:if="${!pet.visits.isEmpty() || !visit['new']}">
    <div class="card-header">
      <h2 class="card-title">
        <i class="fa fa-history" aria-hidden="true" style="color:var(--clr-primary-600);margin-right:var(--sp-2);"></i>
        <span th:text="#{previousVisits}">Previous Visits</span>
      </h2>
    </div>
    <div class="table-container">
      <table class="table">
        <thead>
          <tr>
            <th th:text="#{date}">Date</th>
            <th th:text="#{description}">Description</th>
          </tr>
        </thead>
        <tbody>
          <tr th:if="${!visit['new']}" th:each="visit : ${pet.visits}">
            <td style="white-space:nowrap;">
              <span style="display:inline-flex;align-items:center;gap:var(--sp-1);color:var(--clr-text-secondary);">
                <i class="fa fa-calendar" aria-hidden="true" style="font-size:var(--text-xs);"></i>
                <span th:text="${#temporals.format(visit.date, 'yyyy-MM-dd')}"></span>
              </span>
            </td>
            <td th:text="${visit.description}"></td>
          </tr>
          <tr th:if="${visit['new'] || pet.visits.isEmpty()}">
            <td colspan="2">
              <span style="font-size:var(--text-sm);color:var(--clr-text-muted);font-style:italic;">
                No previous visits recorded.
              </span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</body>

</html>
