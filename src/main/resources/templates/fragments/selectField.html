<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org">

<body>
  <form>
    <th:block th:fragment="select (label, name, items)">
      <div th:with="valid=${!#fields.hasErrors(name)}"
           th:class="${'form-group' + (valid ? '' : ' has-error')}"
           class="form-group">
        <label th:for="${name}" class="col-sm-2 control-label" th:text="${label}">Label</label>
        <div class="col-sm-10">
          <select class="form-control" th:field="*{__${name}__}" style="cursor:pointer;">
            <option th:each="item : ${items}" th:value="${item}" th:text="${item}">dog</option>
          </select>
          <th:block th:if="${!valid}">
            <span class="help-inline" th:errors="*{__${name}__}"
                  style="color:var(--clr-error);font-size:var(--text-xs);">Error</span>
          </th:block>
        </div>
      </div>
    </th:block>
  </form>
</body>

</html>
